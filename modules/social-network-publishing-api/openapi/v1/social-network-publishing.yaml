openapi: 3.1.0
info: {title: Social Network Publishing API, version: 1.0.0}
paths:
  /api/v1/social-network/publishing/publications:
    get: {operationId: social.network.publishing.list, security: [{sanctum: []}], parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}], responses: {'200': {description: Authorized publications}}}
    post: {operationId: social.network.publishing.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationRequest'}}}}, responses: {'201': {description: Publication created}, '422': {description: Validation problem}}}
  /api/v1/social-network/publishing/publications/{publication}:
    parameters: [{name: publication, in: path, required: true, schema: {type: string}}]
    get: {operationId: social.network.publishing.get, security: [{sanctum: []}], responses: {'200': {description: Publication}}}
    patch: {operationId: social.network.publishing.update, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationRequest'}}}}, responses: {'200': {description: Publication updated}}}
    delete: {operationId: social.network.publishing.delete, security: [{sanctum: []}], responses: {'204': {description: Publication deleted}}}
  /api/v1/social-network/publishing/publications/{publication}/publish:
    post: {operationId: social.network.publishing.publish, security: [{sanctum: []}], parameters: [{name: publication, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Publication published}}}
  /api/v1/social-network/publishing/publications/{publication}/enrichments:
    patch: {operationId: social.network.publishing.enrichments, security: [{sanctum: []}], parameters: [{name: publication, in: path, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {mentions: {type: array, items: {type: string}}, hashtags: {type: array, items: {type: string}}, links: {type: array, items: {type: object}}, poll: {type: object}}}}}}, responses: {'200': {description: Publication enrichments updated}}}
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  schemas:
    PublicationRequest:
      type: object
      additionalProperties: false
      properties:
        kind: {type: string, enum: [post, article]}
        audience: {type: string, enum: [public, followers, private]}
        title: {type: [string, 'null'], maxLength: 240}
        body: {type: [string, 'null'], maxLength: 100000}
        metadata: {type: object, additionalProperties: true}
        scheduled_at: {type: [string, 'null'], format: date-time}
